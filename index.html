<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dutch irregular verbs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F7; --surface:#FFFFFF; --ink:#0E1A3A; --muted:#5A6482; --line:#D5DBE8;
  --board:#FFC917; --board-ink:#0E1A3A; --blue:#1C3F94; --ok:#1F7A4D; --err:#B8322A;
  --ok-bg:#E2F3EA; --err-bg:#FBE6E4;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1330; --surface:#16214A; --ink:#EDF0FA; --muted:#A3ACCB; --line:#2A3766;
    --board:#FFC917; --board-ink:#0E1A3A; --blue:#8FB0FF; --ok:#5FD39A; --err:#FF8A80;
    --ok-bg:#123A2A; --err-bg:#3E1A1A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1330; --surface:#16214A; --ink:#EDF0FA; --muted:#A3ACCB; --line:#2A3766;
  --board:#FFC917; --board-ink:#0E1A3A; --blue:#8FB0FF; --ok:#5FD39A; --err:#FF8A80;
  --ok-bg:#123A2A; --err-bg:#3E1A1A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font-size:clamp(26px,6vw,38px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
h1 small{display:block;font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:6px}
.progress{font-size:14px;color:var(--muted);text-align:right}
.progress b{color:var(--ink);font-size:20px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px;width:160px}
.bar i{display:block;height:100%;background:var(--board);width:0;transition:width .3s}
nav{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:20px}
nav button{flex:1;border:0;background:transparent;color:var(--muted);font:600 15px/1 inherit;font-family:inherit;padding:12px 8px;border-radius:10px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--blue);color:#fff}
:root[data-theme="dark"] nav button[aria-selected="true"]{color:#0C1330}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav button[aria-selected="true"]{color:#0C1330}}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.view[hidden]{display:none}

/* flashcard: departure-board style */
.board{background:var(--board);color:var(--board-ink);border-radius:18px;padding:22px 22px 26px;min-height:300px;cursor:pointer;user-select:none;position:relative;display:flex;flex-direction:column}
.board .count{font-size:14px;font-weight:600;opacity:.7}
.board .inf{font-size:clamp(40px,11vw,64px);font-weight:800;letter-spacing:-.03em;line-height:1;margin:22px 0 8px}
.board .tr{font-size:19px;font-weight:500}
.board .hint{margin-top:auto;font-size:14px;opacity:.7;padding-top:20px}
.forms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px}
.forms div{background:var(--board-ink);color:var(--board);border-radius:10px;padding:10px 12px}
.forms span{display:block;font-size:12px;opacity:.8;color:#fff}
.forms strong{font-size:clamp(17px,4.5vw,22px);font-weight:600;word-break:break-word}
.speak{position:absolute;top:16px;right:16px;border:0;background:rgba(14,26,58,.12);color:var(--board-ink);width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 16px/1 inherit;font-family:inherit;padding:15px;border-radius:12px;cursor:pointer}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0C1330}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0C1330}}
.btn.good{border-color:var(--ok);color:var(--ok)}
.btn.again{border-color:var(--err);color:var(--err)}
.filter{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:14px;color:var(--muted)}

/* quiz */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.qcard .inf{font-size:clamp(34px,9vw,48px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.qcard .tr{color:var(--muted);font-size:18px;margin-bottom:18px}
label.f{display:block;margin-bottom:12px;font-size:14px;color:var(--muted);font-weight:500}
label.f input{display:block;width:100%;margin-top:5px;font:500 19px/1.2 inherit;font-family:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input.ok{border-color:var(--ok)!important;background:var(--ok-bg)!important}
input.bad{border-color:var(--err)!important;background:var(--err-bg)!important}
.fix{display:block;font-size:14px;color:var(--err);margin-top:4px;font-weight:600}
.aux{display:flex;gap:8px;margin-top:5px}
.aux button{flex:1;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:600 17px/1 inherit;font-family:inherit;padding:12px;border-radius:10px;cursor:pointer}
.aux button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue);color:#fff}
.aux button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.aux button.bad{border-color:var(--err);background:var(--err-bg);color:var(--err)}
.score{font-size:14px;color:var(--muted);margin-bottom:10px}

/* table */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:13px;position:sticky;top:0;background:var(--surface)}
td:first-child{font-weight:700}
tr:last-child td{border-bottom:0}
td.tr{color:var(--muted)}
tr.known td:first-child::after{content:" ✓";color:var(--ok)}
.note{font-size:14px;color:var(--muted);margin:14px 2px 0}
@media (max-width:480px){.forms{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Sterke werkwoorden<small>The 30 most common Dutch irregular verbs</small></h1>
    <div class="progress"><b id="knownN">0</b> of 30 learned<div class="bar"><i id="barFill"></i></div></div>
  </header>

  <nav role="tablist">
    <button role="tab" data-v="cards" aria-selected="true">Flashcards</button>
    <button role="tab" data-v="quiz" aria-selected="false">Quiz</button>
    <button role="tab" data-v="table" aria-selected="false">Table</button>
  </nav>

  <section class="view" id="v-cards">
    <div class="board" id="board" tabindex="0" role="button" aria-label="Flip card"></div>
    <div class="row" id="cardBtns">
      <button class="btn again" id="againBtn">Review again</button>
      <button class="btn good" id="knowBtn">I know it</button>
    </div>
    <label class="filter"><input type="checkbox" id="onlyNew"> Show only verbs I haven’t learned</label>
  </section>

  <section class="view" id="v-quiz" hidden>
    <div class="score" id="score">Correct: 0 of 0</div>
    <div class="qcard">
      <div class="inf" id="qInf"></div>
      <div class="tr" id="qTr"></div>
      <label class="f">Past tense, singular (ik / jij / hij)
        <input id="aEv" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <label class="f">Past tense, plural (wij / jullie / zij)
        <input id="aMv" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <label class="f">Past participle (voltooid deelwoord)
        <input id="aVd" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <div class="f" style="font-size:14px;color:var(--muted);font-weight:500">Auxiliary verb
        <div class="aux" id="auxBtns">
          <button data-a="hebben" aria-pressed="false">hebben</button>
          <button data-a="zijn" aria-pressed="false">zijn</button>
        </div>
      </div>
      <div class="row"><button class="btn primary" id="checkBtn">Check</button></div>
    </div>
  </section>

  <section class="view" id="v-table" hidden>
    <div class="tablewrap"><table>
      <thead><tr><th>Infinitive</th><th>Past singular</th><th>Past plural</th><th>Participle</th><th>English</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table></div>
    <p class="note">The participle is shown with its auxiliary verb: <b>heeft</b> = hebben, <b>is</b> = zijn. For example: ik heb gegeten, ik ben gegaan.</p>
  </section>
</div>

<script>
const V=[
 ["zijn","was","waren","geweest","zijn","to be"],
 ["hebben","had","hadden","gehad","hebben","to have"],
 ["gaan","ging","gingen","gegaan","zijn","to go"],
 ["komen","kwam","kwamen","gekomen","zijn","to come"],
 ["doen","deed","deden","gedaan","hebben","to do"],
 ["zeggen","zei","zeiden","gezegd","hebben","to say"],
 ["zien","zag","zagen","gezien","hebben","to see"],
 ["krijgen","kreeg","kregen","gekregen","hebben","to get, receive"],
 ["geven","gaf","gaven","gegeven","hebben","to give"],
 ["nemen","nam","namen","genomen","hebben","to take"],
 ["staan","stond","stonden","gestaan","hebben","to stand"],
 ["zitten","zat","zaten","gezeten","hebben","to sit"],
 ["liggen","lag","lagen","gelegen","hebben","to lie (be lying)"],
 ["lopen","liep","liepen","gelopen","hebben/zijn","to walk"],
 ["blijven","bleef","bleven","gebleven","zijn","to stay"],
 ["worden","werd","werden","geworden","zijn","to become"],
 ["beginnen","begon","begonnen","begonnen","zijn","to begin"],
 ["schrijven","schreef","schreven","geschreven","hebben","to write"],
 ["lezen","las","lazen","gelezen","hebben","to read"],
 ["spreken","sprak","spraken","gesproken","hebben","to speak"],
 ["eten","at","aten","gegeten","hebben","to eat"],
 ["drinken","dronk","dronken","gedronken","hebben","to drink"],
 ["kopen","kocht","kochten","gekocht","hebben","to buy"],
 ["denken","dacht","dachten","gedacht","hebben","to think"],
 ["brengen","bracht","brachten","gebracht","hebben","to bring"],
 ["vinden","vond","vonden","gevonden","hebben","to find; to think (opinion)"],
 ["weten","wist","wisten","geweten","hebben","to know (a fact)"],
 ["kunnen","kon","konden","gekund","hebben","can, to be able to"],
 ["willen","wilde / wou","wilden","gewild","hebben","to want"],
 ["mogen","mocht","mochten","gemogen","hebben","may, to be allowed to"]
];
const auxShort=a=>a==="zijn"?"is":a==="hebben"?"heeft":"heeft / is";
let known=new Set();
try{known=new Set(JSON.parse(localStorage.getItem("nl-known")||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem("nl-known",JSON.stringify([...known]))}catch(e){}};
function updProgress(){document.getElementById("knownN").textContent=known.size;document.getElementById("barFill").style.width=(known.size/V.length*100)+"%";renderTable()}

function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="nl-NL";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

/* tabs */
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",x===b));
  document.querySelectorAll(".view").forEach(s=>s.hidden=s.id!=="v-"+b.dataset.v);
  if(b.dataset.v==="quiz")document.getElementById("aEv").focus();
});

/* cards */
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let deck=[],pos=0,flipped=false;
const onlyNew=document.getElementById("onlyNew");
function newDeck(){let idx=V.map((_,i)=>i);if(onlyNew.checked)idx=idx.filter(i=>!known.has(V[i][0]));deck=shuffle(idx);pos=0;flipped=false;drawCard()}
function drawCard(){
  const b=document.getElementById("board");
  if(!deck.length){b.innerHTML='<div class="inf" style="font-size:36px">All learned!</div><div class="tr">Untick the box below to review all 30 again.</div>';return}
  if(pos>=deck.length){deck=shuffle(deck);pos=0}
  const v=V[deck[pos]];
  b.innerHTML=`<div class="count">${pos+1} / ${deck.length}</div>
   <button class="speak" aria-label="Pronounce">🔊</button>
   <div class="inf">${v[0]}</div><div class="tr">${v[5]}</div>
   ${flipped?`<div class="forms">
     <div><span>singular</span><strong>${v[1]}</strong></div>
     <div><span>plural</span><strong>${v[2]}</strong></div>
     <div><span>participle</span><strong>${auxShort(v[4])} ${v[3]}</strong></div></div>`
   :`<div class="hint">Recall the three forms, then tap to check</div>`}`;
  b.querySelector(".speak").onclick=e=>{e.stopPropagation();say(flipped?`${v[0]}, ${v[1]}, ${v[2]}, ${v[3]}`:v[0])};
}
const board=document.getElementById("board");
board.onclick=()=>{flipped=!flipped;drawCard()};
board.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();board.click()}};
function next(){pos++;flipped=false;drawCard()}
document.getElementById("knowBtn").onclick=()=>{if(!deck.length)return;known.add(V[deck[pos]][0]);save();updProgress();if(onlyNew.checked){deck.splice(pos,1);flipped=false;drawCard()}else next()};
document.getElementById("againBtn").onclick=()=>{if(!deck.length)return;known.delete(V[deck[pos]][0]);save();updProgress();const c=deck.splice(pos,1)[0];deck.splice(Math.min(pos+3,deck.length),0,c);flipped=false;drawCard()};
onlyNew.onchange=newDeck;

/* quiz */
let qOrder=shuffle(V.map((_,i)=>i)),qi=0,qv,checked=false,right=0,total=0,aux=null;
const ins=["aEv","aMv","aVd"].map(id=>document.getElementById(id));
const norm=s=>s.trim().toLowerCase().replace(/\s+/g," ").replace(/^(ik|hij|zij|wij|we|ze|heeft|is|heb|ben|hebben|zijn)\s+/,"");
const accept=c=>c.split("/").map(x=>x.trim());
function drawQ(){
  if(qi>=qOrder.length){qOrder=shuffle(qOrder);qi=0}
  qv=V[qOrder[qi]];checked=false;aux=null;
  document.getElementById("qInf").textContent=qv[0];
  document.getElementById("qTr").textContent=qv[5];
  ins.forEach(i=>{i.value="";i.className="";i.disabled=false;const f=i.parentNode.querySelector(".fix");if(f)f.remove()});
  document.querySelectorAll("#auxBtns button").forEach(b=>{b.className="";b.setAttribute("aria-pressed","false")});
  document.getElementById("checkBtn").textContent="Check";
  ins[0].focus();
}
document.querySelectorAll("#auxBtns button").forEach(b=>b.onclick=()=>{if(checked)return;aux=b.dataset.a;document.querySelectorAll("#auxBtns button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
function check(){
  if(checked){qi++;drawQ();return}
  checked=true;let allOk=true;
  [1,2,3].forEach((k,n)=>{const i=ins[n];const ok=accept(qv[k]).includes(norm(i.value));i.className=ok?"ok":"bad";i.disabled=true;
    if(!ok){allOk=false;const s=document.createElement("span");s.className="fix";s.textContent="Correct: "+qv[k];i.after(s)}});
  const auxOk=aux&&accept(qv[4]).includes(aux);
  if(!auxOk)allOk=false;
  document.querySelectorAll("#auxBtns button").forEach(b=>{b.setAttribute("aria-pressed","false");if(accept(qv[4]).includes(b.dataset.a))b.className="ok";else if(b.dataset.a===aux)b.className="bad"});
  total++;if(allOk){right++;known.add(qv[0]);save();updProgress()}
  document.getElementById("score").textContent=`Correct: ${right} of ${total}`;
  document.getElementById("checkBtn").textContent="Next";
  say(`${qv[0]}, ${qv[1]}, ${qv[2]}, ${qv[3]}`);
  document.getElementById("checkBtn").focus();
}
document.getElementById("checkBtn").onclick=check;
ins.forEach((i,n)=>i.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();if(n<2)ins[n+1].focus();else check()}});

/* table */
function renderTable(){
  document.getElementById("tbody").innerHTML=V.map(v=>`<tr class="${known.has(v[0])?"known":""}"><td>${v[0]}</td><td>${v[1]}</td><td>${v[2]}</td><td>${auxShort(v[4])} ${v[3]}</td><td class="tr">${v[5]}</td></tr>`).join("");
}

updProgress();newDeck();drawQ();
</script>
</body>
</html>
